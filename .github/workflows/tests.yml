name: Tests

on:
  push:
    branches:
      - modernization
  pull_request:
    branches:
      - modernization
      - main

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build and run tests
        run: |
          make clean
          make test

  windows-tests:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up MSYS2 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build and run tests
        shell: msys2 {0}
        run: |
          make clean
          make test